<style>
:root{
  --paper:#EDEFEA;
  --paper-raised:#F5F6F2;
  --ink:#1A2457;
  --ink-soft:#465080;
  --ink-faint:#8A91B0;
  --line:#C6CBD8;
  --line-strong:#1A2457;
  --grid:rgba(26,36,87,.07);
  --red:#C4311C;
  --red-wash:rgba(196,49,28,.07);
  --code-bg:#E3E6E0;
  --ph-bg:rgba(196,49,28,.11);
  --ph-ink:#A82714;
  --display:"Martian Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --body:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Fragment Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --index-w:288px;
  --measure:68ch;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E2242;--paper-raised:#132A50;--ink:#E4ECF8;--ink-soft:#A8BAD8;--ink-faint:#6F86AD;
    --line:#2B4674;--line-strong:#CFDBEE;--grid:rgba(207,219,238,.055);--red:#FF8F70;
    --red-wash:rgba(255,143,112,.09);--code-bg:#0A1A34;--ph-bg:rgba(255,143,112,.17);--ph-ink:#FF8F70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E2242;--paper-raised:#132A50;--ink:#E4ECF8;--ink-soft:#A8BAD8;--ink-faint:#6F86AD;
  --line:#2B4674;--line-strong:#CFDBEE;--grid:rgba(207,219,238,.055);--red:#FF8F70;
  --red-wash:rgba(255,143,112,.09);--code-bg:#0A1A34;--ph-bg:rgba(255,143,112,.17);--ph-ink:#FF8F70;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{
  background:var(--paper);color:var(--ink);
  font:400 17px/1.62 var(--body);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-feature-settings:"ss01" 1;
}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.18em}
a:hover{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:2px}
::selection{background:var(--ph-bg)}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
@media (min-width:1100px){
  .shell{grid-template-columns:var(--index-w) minmax(0,1fr)}
  html{scroll-padding-top:24px}
}
.main{padding-inline:clamp(16px,4.5vw,64px);padding-block:0 120px;min-width:0}
.col{max-width:900px}

/* ---------- mobile masthead ---------- */
.mast{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:10px clamp(16px,4.5vw,64px);margin-inline:calc(-1 * clamp(16px,4.5vw,64px));
  background:var(--paper);border-bottom:1px solid var(--line);
}
.mast__name{font:600 12px/1.2 var(--display);letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast__btn{border:1px solid var(--line-strong);background:transparent;padding:7px 12px;font:500 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.mast__progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--red)}
@media (min-width:1100px){.mast{display:none}}

/* ---------- index ---------- */
/* Closed, the drawer is hidden as well as moved, so keyboard focus never lands off-screen.
   visibility waits for the slide to finish, so closing still animates. */
.index{
  position:fixed;inset:0 auto 0 0;z-index:40;width:min(88vw,340px);
  transform:translateX(-102%);visibility:hidden;
  transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;
  background:var(--paper-raised);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.index.is-open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(10,16,40,.35);border:0}
@media (min-width:1100px){
  .index{position:sticky;top:0;height:100vh;width:auto;transform:none;visibility:visible;transition:none;z-index:1}
  .scrim{display:none}
}
.index__head{padding:22px 20px 14px;border-bottom:1px solid var(--line)}
.index__kicker{font:500 10.5px/1.3 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.index__title{font:650 15px/1.25 var(--display);margin-top:6px;text-wrap:balance}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:11px 0;font:500 10.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font-variant-numeric:tabular-nums}
.panes{flex:1;overflow:auto;overscroll-behavior:contain}
.pane{padding:12px 10px 28px}
.ix-group{font:500 10px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);padding:18px 10px 8px}
.ix-group:first-child{padding-top:8px}
.ix{display:grid;grid-template-columns:34px minmax(0,1fr) 16px;align-items:baseline;gap:6px;padding:6px 10px;text-decoration:none;border-radius:3px;font-size:14px;line-height:1.3}
.ix:hover{background:var(--red-wash);color:var(--ink)}
.ix.is-current{background:var(--ink);color:var(--paper)}
.ix.is-current .ix__num,.ix.is-current .mk{color:var(--paper)}
.ix__num{font:500 11px/1.3 var(--display);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ix--sub{padding-left:10px}
.ix--sub .ix__name{color:var(--ink-soft)}
.ix--tpl{grid-template-columns:minmax(0,1fr) auto;font-size:13.5px}
.ix--tpl .ix__num{text-align:right}
.ix--file .ix__name{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.pfilter{width:calc(100% - 20px);margin:4px 10px 8px;padding:9px 10px;border:1px solid var(--ink-soft);background:var(--paper);color:var(--ink);font:400 14px/1.2 var(--body);border-radius:3px}
.pfilter::placeholder{color:var(--ink-soft);opacity:1}
.pane__action{display:block;margin:4px 10px 10px;border:1px solid var(--line-strong);background:transparent;padding:8px 10px;font:500 10.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;width:calc(100% - 20px)}
.pane__action:hover{background:var(--ink);color:var(--paper)}
.index__foot{padding:12px 20px;border-top:1px solid var(--line);font:400 11px/1.5 var(--display);color:var(--ink-soft)}
.index__foot button{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:.2em;font:inherit;color:inherit}

/* revision marks */
.mk{display:inline-block;width:14px;height:14px;vertical-align:-2px;color:var(--ink)}
.mk svg{display:block;width:100%;height:100%;overflow:visible}

/* ---------- hero / title block ---------- */
.hero{
  margin-inline:calc(-1 * clamp(16px,4.5vw,64px));
  padding:clamp(28px,5vw,64px) clamp(16px,4.5vw,64px) 36px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-position:-1px -1px;
  border-bottom:1px solid var(--line);
}
.hero__kicker{font:500 11px/1.4 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.hero__title{
  font-family:var(--display);font-weight:640;font-variation-settings:"wdth" 100;
  font-size:clamp(34px,6.4vw,78px);line-height:.98;letter-spacing:-.035em;
  margin:14px 0 0;max-width:15ch;text-wrap:balance;overflow-wrap:anywhere;
}
.hero__lede{max-width:var(--measure);margin-top:22px;font-size:clamp(17px,1.6vw,19.5px);line-height:1.55;color:var(--ink)}
.hero__lede p{margin:0 0 .8em}
.tblock{
  margin:30px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;
  border:1px solid var(--line-strong);background:var(--line);max-width:900px;
}
@media (min-width:640px){.tblock{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tblock > div{padding:9px 12px 10px;background:var(--paper);min-width:0}
.tblock dt{font:500 9.5px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.tblock dd{margin:5px 0 0;font:500 14px/1.25 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tblock dd .red{color:var(--red)}

/* pipeline — the one loud moment */
.pipe{margin-top:34px;max-width:1100px}
.pipe__cap{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font:500 10.5px/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.pipe__cap .mk{margin-right:6px}
.pipe__scroll{overflow-x:auto;margin-top:14px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.pipe__inner{min-width:880px}
.pipe__lens,.pipe__loops{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:9px 12px;border:1px dashed var(--line-strong);font-size:13.5px;line-height:1.4}
.pipe__lens .lbl,.pipe__loops .lbl{font:500 10px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);flex:none}
.pipe__loops a,.pipe__lens a{text-decoration:none;border-bottom:1px solid var(--line)}
.pipe__loops a:hover,.pipe__lens a:hover{border-color:var(--red)}
.pipe__loops .sep{color:var(--ink-soft)}
.line{list-style:none;margin:0;padding:22px 0 18px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);position:relative}
.line::before{content:"";position:absolute;left:0;right:0;top:calc(22px + 11px);height:1.5px;background:var(--line-strong)}
.st a{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-decoration:none;padding-right:8px;position:relative}
.st__mark{width:22px;height:22px;background:var(--paper);border-radius:50%}
.st__mark svg{display:block;width:22px;height:22px;overflow:visible}
.st__num{font:600 12px/1 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.st__name{font-size:13.5px;line-height:1.25;text-wrap:balance}
.st--ins .st__mark{width:22px}
.st--ins .st__name{font-size:12.5px;color:var(--ink-soft);font-style:italic}
.st a:hover .st__name{color:var(--red)}
.st--added .st__num,.st--moved .st__num{color:var(--red)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s cubic-bezier(.6,0,.2,1) forwards;animation-delay:calc(.35s + var(--i,0) * .09s)}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}

/* ---------- sheets ---------- */
.sheet{padding-top:clamp(56px,8vw,96px)}
.sheet__head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 18px;align-items:end;padding-bottom:14px;border-bottom:1.5px solid var(--line-strong);max-width:900px}
.sheet__num{
  grid-row:span 2;align-self:stretch;display:flex;align-items:flex-end;
  font-family:var(--display);font-weight:300;font-variation-settings:"wdth" 112.5;
  font-size:clamp(40px,6vw,64px);line-height:.8;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
}
.sheet[data-origin="added"] .sheet__num,.sheet[data-origin="moved"] .sheet__num{color:var(--red)}
.sheet__num:empty{display:none}
.sheet__head.no-num{grid-template-columns:minmax(0,1fr)}
.sheet__meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font:500 10.5px/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.sheet__meta .rev{display:inline-flex;gap:7px;align-items:center}
.sheet[data-origin="added"] .rev,.sheet[data-origin="moved"] .rev{color:var(--red)}
.sheet__copy{margin-left:auto;border:1px solid var(--line);background:transparent;padding:5px 9px;font:500 10px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.sheet__copy:hover{border-color:var(--line-strong);color:var(--ink)}
.sheet__title{font:720 clamp(27px,3.6vw,42px)/1.08 var(--body);letter-spacing:-.022em;margin:10px 0 0;text-wrap:balance}

/* ---------- prose ---------- */
.prose{max-width:900px}
.prose > *{max-width:var(--measure)}
.prose > figure,.prose > .tablewrap,.prose > pre,.prose > .code,.prose > .note--output{max-width:none}
.prose p{margin:0 0 1em}
.prose > p:first-child{margin-top:26px}
.prose h3{font:700 clamp(20px,2.1vw,23px)/1.25 var(--body);letter-spacing:-.012em;margin:2.1em 0 .55em;text-wrap:balance}
.prose h4{font:600 11.5px/1.35 var(--display);letter-spacing:.1em;text-transform:uppercase;margin:2em 0 .7em;color:var(--ink)}
.prose h5,.prose h6{font:700 15px/1.3 var(--body);margin:1.6em 0 .5em}
.prose strong{font-weight:680}
.prose ul,.prose ol{padding-left:1.35em;margin:0 0 1.1em}
.prose li{margin:.3em 0}
.prose li > ul,.prose li > ol{margin:.3em 0 .4em}
.prose ul > li::marker{color:var(--ink-soft);content:"– "}
.prose ol > li::marker{font:500 .8em var(--display);color:var(--ink-soft)}
.prose code{font:400 .86em/1 var(--mono);background:var(--code-bg);padding:.18em .36em;border-radius:3px;overflow-wrap:anywhere}
.prose hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.prose li.task{list-style:none;margin-left:-1.35em;display:flex;gap:10px;align-items:flex-start}
.prose li.task::marker{content:""}
.prose li.task input{appearance:none;-webkit-appearance:none;flex:none;width:15px;height:15px;margin:.3em 0 0;border:1.5px solid var(--ink-soft);border-radius:2px;background:var(--paper);cursor:pointer;display:grid;place-content:center}
.prose li.task input::after{content:"";width:8px;height:4px;border-left:2px solid var(--paper);border-bottom:2px solid var(--paper);transform:translateY(-1px) rotate(-45deg);opacity:0}
.prose li.task input:checked{background:var(--ink);border-color:var(--ink)}
.prose li.task input:checked::after{opacity:1}
.prose li.task.is-done > span{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--ink-faint)}

/* tables */
.tablewrap{overflow-x:auto;margin:1.2em 0 1.6em;-webkit-overflow-scrolling:touch}
.prose table{border-collapse:collapse;font-size:14.5px;line-height:1.45;font-variant-numeric:tabular-nums;min-width:100%}
.prose th{font:500 10.5px/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:9px 12px;border:1px solid var(--line-strong);background:var(--paper-raised);vertical-align:bottom}
.prose td{padding:9px 12px;border:1px solid var(--line);vertical-align:top}
.prose td:first-child{font-weight:600}

/* notes / callouts — drafting annotations, not cards */
.note{display:grid;grid-template-columns:96px minmax(0,1fr);gap:0 12px;margin:1.5em 0}
.note__tag{display:flex;align-items:flex-start;gap:8px;font:600 10.5px/1.9 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);padding-top:2px;white-space:nowrap}
.note__tag::after{content:"";flex:1;min-width:8px;border-top:1px solid var(--line);margin-top:.95em}
.note__body > :last-child{margin-bottom:0}
.note__body{font-size:16px;line-height:1.58}
.note--trap .note__tag{color:var(--red)}
.note--rule .note__tag{color:var(--ink)}
.note--rule .note__body{font-weight:560}
.note--output{grid-template-columns:minmax(0,1fr);border:1px solid var(--line-strong);padding:12px 14px 13px;margin:22px 0 8px;background:var(--paper-raised)}
.note--output .note__tag{line-height:1;margin-bottom:8px}
.note--output .note__tag::after{display:none}
.note--output .note__body{font-size:15.5px}
@media (max-width:560px){
  .note{grid-template-columns:minmax(0,1fr)}
  .note__tag::after{display:none}
}
.prose blockquote{margin:1.4em 0;padding:0 0 0 16px;border-left:1px solid var(--line-strong);color:var(--ink-soft)}

/* templates — detail boxes */
.tpl{margin:1.6em 0 1.9em;border:1px solid var(--line-strong);background:var(--paper-raised);position:relative}
.tpl__bar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tpl__kind{font:600 9.5px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border:1px solid currentColor}
.tpl--prompt .tpl__kind{color:var(--red)}
.tpl__title{font:600 14.5px/1.3 var(--body);flex:1;min-width:12ch}
.tpl--file .tpl__title{font:400 13.5px/1.3 var(--mono)}
.tpl__meta{font:400 10.5px/1 var(--display);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tpl__copy{border:1px solid var(--line-strong);background:var(--paper);padding:6px 11px;font:500 10.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.tpl__copy:hover{background:var(--ink);color:var(--paper)}
.tpl__copy.is-done{background:var(--ink);color:var(--paper)}
.tpl pre{margin:0;padding:14px 14px 16px;overflow:auto;font:400 13.4px/1.62 var(--mono);color:var(--ink);tab-size:2}
.tpl--prompt pre{white-space:pre-wrap;overflow-wrap:anywhere}
.tpl.is-clamped pre{max-height:25.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.tpl__more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:9px;font:500 10.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.tpl__more:hover{color:var(--ink);background:var(--red-wash)}
.ph{color:var(--ph-ink);background:var(--ph-bg);border-radius:2px;padding:0 .12em}
.code{margin:1.3em 0 1.6em;border:1px solid var(--line);background:var(--code-bg)}
.code__bar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);font:500 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.code__bar button{border:0;background:transparent;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink-soft);padding:4px}
.code__bar button:hover{color:var(--ink)}
.code pre{margin:0;padding:12px 14px 14px;overflow:auto;font:400 13.2px/1.6 var(--mono)}
.code--wrap pre{white-space:pre-wrap;overflow-wrap:anywhere}

/* register (auto-built) */
.reg td:first-child{font-weight:500}
.reg td .go{text-decoration:none;border-bottom:1px solid var(--line)}
.reg td .go:hover{border-color:var(--red)}
.reg td button{border:1px solid var(--line);background:transparent;padding:4px 8px;font:500 10px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.reg td button:hover{border-color:var(--line-strong);color:var(--ink)}
.reg td.path{font-family:var(--mono);font-size:13px;font-weight:400}

.colophon{margin-top:96px;padding-top:16px;border-top:1px solid var(--line);font:400 11.5px/1.6 var(--display);color:var(--ink-soft);max-width:900px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;font:500 11px/1.3 var(--display);letter-spacing:.06em;z-index:60;max-width:calc(100% - 32px)}
.fail{padding:40px 0;max-width:var(--measure)}
@media (prefers-reduced-motion:reduce){.index,.index.is-open{transition:none}}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
/* Sections take focus after a jump from the index; they are not controls, so no ring. */
[tabindex="-1"]:focus{outline:none}
</style>

<div class="shell">
  <aside class="index" id="index" aria-label="Guide index">
    <div class="index__head">
      <a class="index__kicker" href="/">← Off the Mode</a>
      <div class="index__title" id="ixTitle"><!--slot:title--></div>
    </div>
    <div class="tabs" role="tablist" aria-label="Index">
      <button class="tab" type="button" role="tab" id="tab-sheets" aria-selected="true" aria-controls="pane-sheets" tabindex="0" data-pane="sheets">Guides</button>
      <button class="tab" type="button" role="tab" id="tab-prompts" aria-selected="false" aria-controls="pane-prompts" tabindex="-1" data-pane="prompts">Prompts <span class="n" id="nPrompts"><!--slot:nPrompts--></span></button>
      <button class="tab" type="button" role="tab" id="tab-files" aria-selected="false" aria-controls="pane-files" tabindex="-1" data-pane="files">Files <span class="n" id="nFiles"><!--slot:nFiles--></span></button>
    </div>
    <div class="panes">
      <div class="pane" id="pane-sheets" role="tabpanel" aria-labelledby="tab-sheets"><nav id="sheetList" aria-label="Guides"><!--slot:sheetList--></nav></div>
      <div class="pane" id="pane-prompts" role="tabpanel" aria-labelledby="tab-prompts" hidden>
        <input class="pfilter" id="pfilter" type="search" placeholder="Find a prompt" aria-label="Find a prompt" autocomplete="off">
        <button class="pane__action" type="button" id="copyAllPrompts">Copy all prompts as Markdown</button>
        <div id="promptList"><!--slot:promptList--></div>
      </div>
      <div class="pane" id="pane-files" role="tabpanel" aria-labelledby="tab-files" hidden>
        <button class="pane__action" type="button" id="copyAllFiles">Copy all files as Markdown</button>
        <div id="fileList"><!--slot:fileList--></div>
      </div>
    </div>
    <div class="index__foot">Checklist ticks stay in this browser. <button type="button" id="clearTicks">Clear ticks</button></div>
  </aside>
  <button class="scrim" type="button" id="scrim" aria-label="Close index" hidden></button>

  <main class="main" id="top">
    <header class="mast">
      <span class="mast__name" id="mastName"><!--slot:title--></span>
      <button class="mast__btn" type="button" id="openIndex" aria-controls="index" aria-expanded="false">Index</button>
      <span class="mast__progress" id="progress"></span>
    </header>

    <section class="hero" aria-labelledby="heroTitle">
      <div class="col">
        <div class="hero__kicker">The Off the Mode method · one guide for each kind of work</div>
        <h1 class="hero__title" id="heroTitle"><!--slot:title--></h1>
        <div class="hero__lede" id="lede"><!--slot:lede--></div>
        <dl class="tblock" id="tblock"><!--slot:tblock--></dl>
      </div>
      <div class="pipe" id="pipe"><!--slot:pipe--></div>
    </section>

    <div id="doc"><!--slot:doc--></div>
    <footer class="colophon col" id="colophon"><!--slot:colophon--></footer>
  </main>
  <div class="sr-only" role="status" id="live"></div>
</div>

<!-- The build (scripts/build-content.mjs) renders the method into the slots above, so the page reads without
     JavaScript. This script only adds the index tabs, the drawer, copying and checklist ticks. -->
<script type="application/json" id="guide-md"><!--slot:guideMd--></script>
<script>
(function(){
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  const store = {
    get(k){ try { return localStorage.getItem(k) } catch(e){ return null } },
    set(k,v){ try { localStorage.setItem(k,v) } catch(e){} },
    del(k){ try { localStorage.removeItem(k) } catch(e){} },
  };
  const doc = $('#doc');
  // Each guide's Markdown source, for "Copy guide".
  let guideMd = {};
  try { guideMd = JSON.parse($('#guide-md').textContent); } catch (e) {}

  /* ---------- checklist ticks: kept in this browser ---------- */
  const ticks = $$('li.task > input[type="checkbox"], li.task > p > input[type="checkbox"]', doc);
  ticks.forEach(cb => {
    const li = cb.closest('li');
    const sync = () => li.classList.toggle('is-done', cb.checked);
    cb.checked = store.get(cb.id) === '1';
    sync();
    cb.addEventListener('change', () => { cb.checked ? store.set(cb.id, '1') : store.del(cb.id); sync(); });
  });
  $('#clearTicks').addEventListener('click', () => {
    ticks.forEach(cb => { cb.checked = false; store.del(cb.id); cb.closest('li').classList.remove('is-done'); });
    toast('Ticks cleared');
  });

  /* ---------- index panes ---------- */
  $('#pfilter').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    $$('#promptList .ix').forEach(a => { a.hidden = q && !a.dataset.label.includes(q); });
  });
  // Tabs: one tab stop for the row; arrows, Home and End move between tabs and show their pane.
  const tabs = $$('#index .tab');
  const selectTab = (tb, focus) => {
    tabs.forEach(x => { const on = x === tb; x.setAttribute('aria-selected', String(on)); x.tabIndex = on ? 0 : -1; });
    $$('#index .pane').forEach(p => { p.hidden = p.id !== 'pane-' + tb.dataset.pane; });
    store.set('ix-tab', tb.dataset.pane);
    if (focus) tb.focus();
  };
  tabs.forEach((tb, i) => {
    tb.addEventListener('click', () => selectTab(tb));
    tb.addEventListener('keydown', e => {
      const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      selectTab(tabs[(to + tabs.length) % tabs.length], true);
    });
  });
  const savedTab = store.get('ix-tab'); if (savedTab && savedTab !== 'sheets') { const tb = $(`#index .tab[data-pane="${savedTab}"]`); tb && selectTab(tb); }

  /* ---------- copy ---------- */
  // Screen readers hear every confirmation through #live, which is in the page from the start.
  const live = $('#live');
  function say(msg) { live.textContent = ''; setTimeout(() => { live.textContent = msg; }, 50); }
  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('aria-hidden', 'true'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
    say(msg);
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); return ok;
  }
  function copy(text, btn) {
    const done = () => {
      if (!btn) return toast('Copied');
      if (!btn.dataset.label) btn.dataset.label = btn.textContent;
      clearTimeout(btn._t); btn.classList.add('is-done'); btn.textContent = 'Copied'; say('Copied');
      btn._t = setTimeout(() => { btn.classList.remove('is-done'); btn.textContent = btn.dataset.label; }, 1400);
    };
    const fail = () => { fallbackCopy(text) ? done() : toast('Copy blocked here. Select the text and press Cmd/Ctrl+C.'); };
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
  }
  // A template's text is its code block's text: the page shows it exactly as written.
  const textOf = id => { const el = document.getElementById(id); const code = el && $('pre code', el); return code ? code.textContent : ''; };
  const templates = kind => $$(`figure.tpl--${kind}`, doc).map(f => ({ label: $('.tpl__title', f).textContent, text: textOf(f.id) }));
  document.addEventListener('click', e => {
    const c = e.target.closest('[data-copy]'); if (c) { copy(textOf(c.dataset.copy), c); return; }
    const m = e.target.closest('[data-more]');
    if (m) { const f = document.getElementById(m.dataset.more); const clamped = f.classList.toggle('is-clamped'); m.textContent = clamped ? `Show all ${m.dataset.lines} lines` : 'Show less'; if (clamped) f.scrollIntoView({ block: 'nearest' }); return; }
    const sh = e.target.closest('[data-sheet]');
    if (sh && guideMd[sh.dataset.sheet]) copy(guideMd[sh.dataset.sheet], sh);
  });
  $('#copyAllPrompts').addEventListener('click', e => copy(templates('prompt').map(r => `### ${r.label}\n\n~~~text\n${r.text}\n~~~\n`).join('\n'), e.currentTarget));
  $('#copyAllFiles').addEventListener('click', e => copy(templates('file').map(r => `### ${r.label}\n\n~~~\n${r.text}\n~~~\n`).join('\n'), e.currentTarget));

  /* ---------- drawer, scroll spy, progress ---------- */
  const index = $('#index'), scrim = $('#scrim'), openBtn = $('#openIndex');
  // Below 1100px the index is a drawer. Opening it moves focus in; closing it hands focus back to the Index button,
  // except after a jump, where focus goes to the section the link points at.
  const isOpen = () => index.classList.contains('is-open');
  const setDrawer = (open, returnFocus = true) => {
    const was = isOpen();
    index.classList.toggle('is-open', open); scrim.hidden = !open; openBtn.setAttribute('aria-expanded', String(open));
    if (open && !was) {
      const pane = $('#index .pane:not([hidden])');
      const to = (pane && pane.id === 'pane-sheets' && $('.ix.is-current', pane)) || $('#index .tab[aria-selected="true"]');
      to && to.focus();
    }
    if (!open && was && returnFocus) openBtn.focus();
  };
  openBtn.addEventListener('click', () => setDrawer(!isOpen()));
  scrim.addEventListener('click', () => setDrawer(false));
  index.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (!a || !isOpen()) return;
    setDrawer(false, false);
    const target = a.hash.length > 1 && document.getElementById(decodeURIComponent(a.hash.slice(1)));
    if (target) { if (!target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1'); target.focus({ preventScroll: true }); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen()) setDrawer(false); });

  const ixLinks = new Map($$('#pane-sheets .ix').map(a => [a.dataset.target, a]));
  let current = null;
  const setCurrent = id => { if (id === current) return; current = id; ixLinks.forEach((a, k) => a.classList.toggle('is-current', k === id)); };
  const secs = $$('.sheet', doc);
  const io = new IntersectionObserver(() => {
    const vis = secs.filter(s => s.getBoundingClientRect().top < innerHeight * 0.35);
    if (vis.length) setCurrent(vis[vis.length - 1].id);
  }, { rootMargin: '0px 0px -60% 0px', threshold: [0, 1] });
  secs.forEach(s => io.observe(s));
  const prog = $('#progress');
  const onScroll = () => { const h = document.documentElement; const p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight); prog.style.width = (p * 100).toFixed(2) + '%'; };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
})();
</script>
