<style>
/* One file on purpose, over max_file_lines: /view loads no outside script (CHECKLIST F8.5), so the page, its styles
   and its one module script travel together and the build pins that script by hash. Drawing-set tokens as in
   app/globals.css; the sheet is direction A ("Stamped Sheet") with C's revisit stamp. */
:root{
  color-scheme: light;
  --paper:#edefea; --paper-raised:#f5f6f2;
  --ink:#1a2457; --ink-soft:#465080; --ink-faint:#8a91b0;
  --line:#c6cbd8; --line-strong:#1a2457;
  --grid:rgba(26,36,87,.07);
  --red:#c4311c; --red-wash:rgba(196,49,28,.07);

  --f-display:"Martian Mono", ui-monospace, monospace;
  --f-body:"Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;
  --f-data:"Fragment Mono", ui-monospace, monospace;
  --wdth-narrow:75%; --wdth-mid:87.5%; --wdth-wide:112.5%;
  --wt-regular:400; --wt-mid:500; --wt-semi:600; --wt-bold:700;

  --fs-0:10px; --fs-1:11px; --fs-2:12px; --fs-3:13px; --fs-4:14px; --fs-5:16px;
  --fs-6:18px; --fs-7:21px; --fs-8:28px; --fs-9:40px; --fs-10:56px;
  --lh-tight:1.12; --lh-data:1.35; --lh-item:1.45; --lh-body:1.55; --lh-read:1.6;
  --track-label:.07em; --track-title:.04em; --track-none:0;

  --s-0:1px; --s-1:2px; --s-2:4px; --s-3:6px; --s-4:8px; --s-5:12px; --s-6:16px;
  --s-7:24px; --s-8:32px; --s-9:48px; --s-10:72px; --s-11:112px;

  --w-hair:1px; --w-mid:1.5px; --w-heavy:2px; --w-border:3px;
  --page-pad:20px; --zone-band:26px;
  --mk:12px; --mk-key:11px; --bub:38px; --tag:22px;
  --measure:68ch;

  --stamp-tilt:-2.5deg; --stamp-max:360px; --stamp-from-tilt:-7deg; --stamp-from-scale:1.22;
  --stamp2-tilt:1.6deg;
  --t-stamp:380ms; --t-stamp-delay:220ms;
  --ease-out:cubic-bezier(.16,.84,.3,1);

  --round:50%;
  --u-offset:.18em; --fs-inline:.92em; --o-muted:.62; --dash:3 2;
  --hatch:repeating-linear-gradient(135deg, var(--ink) 0 var(--w-hair), transparent var(--w-hair) calc(var(--w-hair) * 3));
  --half:linear-gradient(90deg, var(--ink) 50%, transparent 50%);
  --cloud-r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0e2242; --paper-raised:#132a50;
    --ink:#e4ecf8; --ink-soft:#a8bad8; --ink-faint:#6f86ad;
    --line:#2b4674; --line-strong:#cfdbee;
    --grid:rgba(207,219,238,.055);
    --red:#ff8f70; --red-wash:rgba(255,143,112,.09);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0e2242; --paper-raised:#132a50;
  --ink:#e4ecf8; --ink-soft:#a8bad8; --ink-faint:#6f86ad;
  --line:#2b4674; --line-strong:#cfdbee;
  --grid:rgba(207,219,238,.055);
  --red:#ff8f70; --red-wash:rgba(255,143,112,.09);
}

/* base */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:var(--fs-5); line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
a{color:inherit; text-decoration-thickness:var(--w-hair); text-underline-offset:var(--u-offset)}
a:hover{text-decoration-thickness:var(--w-heavy)}
:focus-visible{outline:var(--w-heavy) solid var(--ink); outline-offset:var(--s-1)}
.pname:focus{outline:none}
button{font:inherit; color:inherit}
code{font-family:var(--f-data); font-size:var(--fs-inline); letter-spacing:var(--track-none)}
p{margin:0}
h1,h2,h3,h4{margin:0; font-weight:inherit}
ol,ul{margin:0; padding:0}
.sr{position:absolute; width:var(--s-0); height:var(--s-0); overflow:hidden; clip-path:inset(50%); white-space:nowrap}
.defs{position:absolute; width:0; height:0; overflow:hidden}
.lab{display:block; font-family:var(--f-display); font-stretch:var(--wdth-narrow); font-size:var(--fs-0); font-weight:var(--wt-mid);
  line-height:var(--lh-data); letter-spacing:var(--track-label); text-transform:uppercase; color:var(--ink-soft)}

/* the sheet: trim line, zone band, heavy border, 12 columns */
.paper{padding:var(--page-pad)}
.trim{position:relative; border:var(--w-hair) solid var(--line); padding:var(--zone-band) var(--s-4) var(--s-4) var(--zone-band)}
.zx{position:absolute; top:0; left:calc(var(--zone-band) + var(--w-border)); right:calc(var(--s-4) + var(--w-border)); height:var(--zone-band);
  display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); list-style:none; pointer-events:none}
.zx li{border-left:var(--w-hair) solid var(--line); font-family:var(--f-data); font-size:var(--fs-1); color:var(--ink-faint); display:flex; align-items:center; justify-content:center}
.zx li:last-child{border-right:var(--w-hair) solid var(--line)}
.frame{position:relative; border:var(--w-border) solid var(--line-strong); display:grid; grid-template-columns:repeat(12,minmax(0,1fr));
  background-image:linear-gradient(90deg, var(--grid) 0 var(--w-hair), transparent var(--w-hair)); background-size:calc(100% / 12) 100%}
.board-wrap{grid-column:1 / 10; grid-row:1; min-width:0}
.tb{grid-column:10 / 13; grid-row:1; min-width:0; border-left:var(--w-heavy) solid var(--line-strong); background:var(--paper)}
.rest{grid-column:1 / 13; grid-row:2; min-width:0}
.zone{position:relative; padding:var(--s-8) 0 var(--s-9); border-top:var(--w-hair) solid var(--line-strong)}
.board-wrap .zone{border-top:0}
.zl{position:absolute; top:calc(-1 * var(--w-hair)); left:calc(-1 * (var(--zone-band) + var(--w-border))); width:var(--zone-band); padding-top:var(--s-3);
  text-align:center; border-top:var(--w-hair) solid var(--line-strong); font-family:var(--f-data); font-size:var(--fs-1); color:var(--ink-faint)}
.board-wrap .zl{border-top:0}

/* view title: bubble, underlined title, scale line */
.vt{display:flex; align-items:flex-start; gap:var(--s-5); padding:0 var(--s-6) var(--s-7)}
.bub{flex:none; display:inline-grid; place-items:center; width:var(--bub); height:var(--bub); border:var(--w-mid) solid var(--line-strong); border-radius:var(--round);
  font-family:var(--f-display); font-stretch:var(--wdth-mid); font-weight:var(--wt-semi); font-size:var(--fs-3); line-height:1; background:var(--paper)}
.vt-t{flex:1; min-width:0}
.vt h2{font-family:var(--f-display); font-stretch:var(--wdth-wide); font-weight:var(--wt-semi); font-size:var(--fs-7); line-height:var(--lh-tight);
  letter-spacing:var(--track-title); text-transform:uppercase; padding:var(--s-1) 0 var(--s-3); border-bottom:var(--w-heavy) solid var(--line-strong)}
.vt-meta{padding-top:var(--s-3); font-family:var(--f-data); font-size:var(--fs-2); color:var(--ink-soft); overflow-wrap:anywhere}

/* label left, content right, on the column grid */
.lr{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); padding:var(--s-6) 0; border-top:var(--w-hair) solid var(--line)}
.lr > .l{grid-column:1 / 3; padding:0 var(--s-6)}
.lr > .r{grid-column:3 / 10; padding:0 var(--s-6); min-width:0; overflow-wrap:anywhere}
.board-wrap .lr{grid-template-columns:repeat(9,minmax(0,1fr))}
.l h3{font-family:var(--f-display); font-stretch:var(--wdth-narrow); font-size:var(--fs-1); font-weight:var(--wt-mid); letter-spacing:var(--track-label);
  text-transform:uppercase; color:var(--ink-soft); line-height:var(--lh-data)}
.l .sub{display:block; margin-top:var(--s-2); font-size:var(--fs-2); line-height:var(--lh-data); color:var(--ink-faint)}

/* marks: verified solid, built hatched, doing half, to do open, dropped struck through a dashed outline */
.mk{position:relative; display:inline-block; flex:none; width:var(--mk); height:var(--mk); border:var(--w-hair) solid var(--ink)}
.mk-verified{background:var(--ink)}
.mk-built{background:var(--hatch)}
.mk-doing{background:var(--half)}
.mk-todo{border-color:var(--ink-soft)}
.mk-dropped{border-style:dashed; border-color:var(--ink-faint)}
.mk-dropped::after{content:""; position:absolute; left:calc(-1 * var(--s-1)); right:calc(-1 * var(--s-1)); top:50%; height:var(--w-heavy); margin-top:calc(var(--w-heavy) / -2); background:var(--ink-soft)}
.hex,.delta{width:var(--tag); height:var(--tag); flex:none; overflow:visible; vertical-align:middle}
.hex path,.delta path{fill:var(--paper); stroke:currentColor; stroke-width:var(--w-mid)}
.hex text,.delta text{fill:currentColor; font-family:var(--f-data); font-size:var(--fs-3); text-anchor:middle}
.delta text{font-size:var(--fs-2)}
.delta.pending path{stroke-dasharray:var(--dash)}
.delta.red{color:var(--red)}
.delta.big{width:calc(var(--tag) * 1.4); height:calc(var(--tag) * 1.4)}

/* title block */
.tb-top{display:flex; flex-direction:column}
.cell{padding:var(--s-5) var(--s-6) var(--s-6); border-top:var(--w-hair) solid var(--line-strong); min-width:0}
.tb-top > .cell:first-child{border-top:0}
.cell > .lab{margin-bottom:var(--s-4)}
.cell-head{display:flex; justify-content:space-between; align-items:baseline; gap:var(--s-4); margin-bottom:var(--s-3)}
.pname{font-family:var(--f-display); font-stretch:var(--wdth-wide); font-weight:var(--wt-semi); font-size:var(--fs-8); line-height:var(--lh-tight); overflow-wrap:anywhere}
.psub{margin-top:var(--s-3); font-size:var(--fs-3); line-height:var(--lh-data); color:var(--ink-soft)}
.btn-quiet{border:0; background:none; padding:0; font-size:var(--fs-2); line-height:var(--lh-data); text-decoration:underline; text-underline-offset:var(--u-offset); cursor:pointer; white-space:nowrap}
.cell-missing{background:var(--paper-raised)}
.missing{list-style:none; display:grid; gap:var(--s-3); font-size:var(--fs-3); line-height:var(--lh-item)}
.missing li{padding-left:var(--s-5); border-left:var(--w-heavy) dashed var(--ink-soft)}
.missing b{font-family:var(--f-data); font-weight:var(--wt-regular)}

/* the review stamp, the one moment that moves; the revisit stamp beside it is still */
.cell-stamp{padding-bottom:var(--s-6)}
.stamps{display:flex; flex-direction:column; align-items:flex-end; gap:var(--s-4)}
.stamp{align-self:stretch; color:var(--red); border:var(--w-border) solid currentColor; outline:var(--w-hair) solid currentColor; outline-offset:calc(-1 * var(--s-3));
  padding:var(--s-5) var(--s-5) var(--s-4); margin:var(--s-2) var(--s-4) 0; max-width:var(--stamp-max); transform:rotate(var(--stamp-tilt)); transform-origin:50% 60%;
  filter:url(#ink); font-family:var(--f-display); font-stretch:var(--wdth-wide); text-transform:uppercase}
.stamp.landing{animation:stamp-in var(--t-stamp) var(--ease-out) var(--t-stamp-delay) both}
@keyframes stamp-in{
  0%{opacity:0; transform:rotate(var(--stamp-from-tilt)) scale(var(--stamp-from-scale))}
  45%{opacity:1}
  100%{opacity:1; transform:rotate(var(--stamp-tilt)) scale(1)}
}
.st-head{display:flex; justify-content:space-between; gap:var(--s-4); padding:0 var(--s-2) var(--s-3); font-size:var(--fs-0); font-weight:var(--wt-semi);
  letter-spacing:var(--track-label); border-bottom:var(--w-hair) solid currentColor}
.st-count{display:flex; align-items:baseline; gap:var(--s-3); padding:var(--s-4) var(--s-2) var(--s-3); border-bottom:var(--w-hair) solid currentColor}
.st-count b{font-size:var(--fs-10); font-weight:var(--wt-bold); line-height:1}
.st-count .of{font-size:var(--fs-8); font-weight:var(--wt-semi); line-height:1}
.st-count .w{margin-left:auto; font-size:var(--fs-1); font-weight:var(--wt-semi); letter-spacing:var(--track-label); align-self:flex-end}
.st-made{padding:var(--s-3) var(--s-2); font-size:var(--fs-0); letter-spacing:var(--track-label); border-bottom:var(--w-hair) solid currentColor; font-weight:var(--wt-mid)}
.st-opts{list-style:none; padding:var(--s-3) var(--s-2) var(--s-2); display:grid; gap:var(--s-2)}
.st-opts li{display:flex; align-items:center; gap:var(--s-4); font-size:var(--fs-2); font-weight:var(--wt-semi); letter-spacing:var(--track-title)}
.st-opts li.off{opacity:var(--o-muted)}
.st-box{position:relative; width:var(--s-6); height:var(--s-6); border:var(--w-mid) solid currentColor; flex:none}
.st-box svg{position:absolute; inset:calc(-1 * var(--s-2)); width:calc(100% + var(--s-4)); height:calc(100% + var(--s-4)); overflow:visible}
.st-box path{fill:none; stroke:currentColor; stroke-width:var(--w-border); stroke-linecap:round}
.st-foot{margin-top:var(--s-3); padding:var(--s-3) var(--s-2) 0; border-top:var(--w-hair) solid currentColor; font-size:var(--fs-0); letter-spacing:var(--track-label); font-weight:var(--wt-semi)}
.stamp2{display:inline-flex; flex-direction:column; align-items:center; gap:var(--s-2); margin:0 var(--s-5) 0 0; padding:var(--s-3) var(--s-6);
  color:var(--red); border:var(--s-2) double currentColor; transform:rotate(var(--stamp2-tilt)); filter:url(#ink);
  font-family:var(--f-display); text-transform:uppercase; text-align:center}
.stamp2 .k{font-size:var(--fs-0); font-weight:var(--wt-semi); font-stretch:var(--wdth-wide); letter-spacing:var(--track-label); line-height:var(--lh-data)}
.stamp2 .d{font-size:var(--fs-8); font-weight:var(--wt-bold); font-stretch:var(--wdth-narrow); line-height:1; padding:var(--s-2) var(--s-3) var(--s-1);
  border-top:var(--w-hair) solid currentColor; border-bottom:var(--w-hair) solid currentColor}
.st-note{margin-top:var(--s-6); font-size:var(--fs-3); line-height:var(--lh-item); color:var(--ink-soft)}

/* keyed notes: what to do next */
.keyed{list-style:none; display:grid; gap:var(--s-4)}
.keyed li{display:grid; grid-template-columns:var(--tag) 1fr; gap:var(--s-4); align-items:start; font-size:var(--fs-4); line-height:var(--lh-item); overflow-wrap:anywhere}
.keyed li:first-child p{font-weight:var(--wt-semi)}
.keyed .hex{margin-top:var(--s-0)}

/* key plan */
.kp{list-style:none; display:grid; gap:var(--s-1)}
.kp a{display:grid; grid-template-columns:calc(var(--fs-2) * 2.4) 1fr auto; align-items:center; gap:var(--s-4); text-decoration:none; padding:var(--s-1) 0}
.kp a:hover .kp-id,.kp a:focus-visible .kp-id{text-decoration:underline}
.kp-id{font-family:var(--f-data); font-size:var(--fs-2)}
.kp-cells{display:flex; flex-wrap:wrap; gap:var(--s-2) var(--s-1)}
.kp-cells .mk{width:var(--mk-key); height:var(--mk-key)}
.kp-n{font-family:var(--f-data); font-size:var(--fs-1); color:var(--ink-soft); text-align:right; min-width:calc(var(--fs-1) * 3.4)}
.legend{list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:var(--s-2) var(--s-5); margin-top:var(--s-5); padding-top:var(--s-4); border-top:var(--w-hair) solid var(--line)}
.legend li{display:flex; align-items:center; gap:var(--s-3); font-size:var(--fs-2); line-height:var(--lh-data)}
.legend .n{margin-left:auto; font-family:var(--f-data); font-size:var(--fs-2)}
.scale{margin-top:var(--s-4); font-family:var(--f-data); font-size:var(--fs-1); color:var(--ink-soft)}

/* fields, revisions, drawing index, general notes */
.fields{display:grid; grid-template-columns:1fr 1fr; border-top:var(--w-hair) solid var(--line-strong)}
.fields > div{padding:var(--s-4) var(--s-6) var(--s-5); border-bottom:var(--w-hair) solid var(--line); min-width:0}
.fields > div:nth-child(odd){border-right:var(--w-hair) solid var(--line)}
.fields .v{font-family:var(--f-data); font-size:var(--fs-3); line-height:var(--lh-data); margin-top:var(--s-1); overflow-wrap:anywhere}
.fields .v small{display:block; font-family:var(--f-body); font-size:var(--fs-2); color:var(--ink-soft)}
.fields .wide{grid-column:1 / -1; border-right:0 !important}
.paper-set{display:flex; gap:var(--s-2); margin-top:var(--s-2)}
.paper-set button{border:var(--w-hair) solid var(--line-strong); background:transparent; padding:var(--s-1) var(--s-4); font-family:var(--f-data); font-size:var(--fs-2); cursor:pointer}
.paper-set button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.revs{width:100%; border-collapse:collapse; font-size:var(--fs-3); line-height:var(--lh-data)}
.revs th{text-align:left; padding:0 var(--s-3) var(--s-3) 0; border-bottom:var(--w-hair) solid var(--line-strong)}
.revs th .lab{display:inline}
.revs td{vertical-align:top; padding:var(--s-3) var(--s-3) var(--s-3) 0; border-bottom:var(--w-hair) solid var(--line); overflow-wrap:anywhere}
.revs td.d{font-family:var(--f-data); font-size:var(--fs-1); white-space:nowrap; color:var(--ink-soft)}
.revs td.n{width:var(--tag)}
.index{list-style:none; display:grid}
.index a,.index span.row{display:grid; grid-template-columns:var(--s-6) 1fr auto; gap:var(--s-4); padding:var(--s-2) 0; text-decoration:none; font-size:var(--fs-3); line-height:var(--lh-data); border-bottom:var(--w-hair) solid var(--line)}
.index a:hover .t{text-decoration:underline}
.index .z{font-family:var(--f-data); font-size:var(--fs-2)}
.index .f{font-family:var(--f-data); font-size:var(--fs-1); color:var(--ink-soft); text-align:right}
.index .gone,.index .gone .f{color:var(--ink-faint)}
.gnotes{list-style:none; counter-reset:gn; display:grid; gap:var(--s-3); font-size:var(--fs-3); line-height:var(--lh-item); color:var(--ink-soft)}
.gnotes li{counter-increment:gn; display:grid; grid-template-columns:calc(var(--fs-2) * 2) 1fr; gap:var(--s-3); overflow-wrap:anywhere}
.gnotes li::before{content:counter(gn); font-family:var(--f-data); font-size:var(--fs-2); color:var(--ink)}

/* the board */
.core-lr .r p{font-size:var(--fs-6); line-height:var(--lh-body); max-width:var(--measure)}
.bay{position:relative; display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); border-top:var(--w-hair) solid var(--line)}
.bay-meta{grid-column:1 / 3; padding:var(--s-6) var(--s-6) var(--s-7); min-width:0}
.bay-head{display:flex; align-items:center; gap:var(--s-4); margin-bottom:var(--s-4)}
.bay-count{font-family:var(--f-data); font-size:var(--fs-2); color:var(--ink-soft); line-height:var(--lh-data)}
.bay h3{font-size:var(--fs-5); font-weight:var(--wt-semi); line-height:var(--lh-tight)}
.bay-meta dl{margin:var(--s-6) 0 0; display:grid; gap:var(--s-4)}
.bay-meta dd{margin:var(--s-1) 0 0; font-size:var(--fs-3); line-height:var(--lh-item)}
.bay-meta dd.for{font-style:italic}

<script type="module">
// Reads a project's .offthemode/ files (plain markdown, as the templates write them) into one object for the view.
// Runs in the browser (the view page) and in Node (tests), so it uses no Node or DOM API. Unknown or missing
// sections become empty values, never errors: a half-filled folder still renders.

const lines = (md) => (md || "").replace(/\r\n?/g, "\n").split("\n");

// "## Heading" blocks: [{ title, body }]; text before the first heading is the preamble.
function sections(md, level = 2) {
  const mark = "#".repeat(level) + " ";
  const out = [];
  let cur = { title: "", body: [] };
  let fence = false;
  for (const line of lines(md)) {
    if (line.startsWith("```")) fence = !fence;
    if (!fence && line.startsWith(mark)) {
      out.push(cur);
      cur = { title: line.slice(mark.length).trim(), body: [] };
    } else cur.body.push(line);
  }
  out.push(cur);
  return out.map((s) => ({ title: s.title, body: s.body.join("\n").trim() }));
}

const MARKS = { " ": "todo", "~": "doing", x: "built", v: "verified", "-": "dropped" };

// "- [x] F1.2 text · done when: ... · guide: ... · evidence: ..." (or "· dropped ...: reason")
function parseItem(line) {
  const m = line.match(/^- \[([ ~xv-])\] (\S+) (.*)$/);
  if (!m) return null;
  const parts = m[3].split(" · ");
  const item = { id: m[2], mark: MARKS[m[1]], text: parts[0].trim(), doneWhen: "", guide: "", evidence: "", dropped: "" };
  // A " · " inside a field's own text (evidence often quotes test output) belongs to the field before it.
  let last = "text";
  for (const p of parts.slice(1)) {
    const kv = p.match(/^(done when|guide|evidence|dropped[^:]*):\s*(.*)$/);
    if (!kv) { item[last] += " · " + p.trim(); continue; }
    last = kv[1].startsWith("dropped") ? "dropped" : kv[1] === "done when" ? "doneWhen" : kv[1];
    item[last] = kv[2].trim();
  }
  return item;
}

function parseChecklist(md) {
  const all = lines(md);
  const header = all.find((l) => l.startsWith("Last revisit:")) || "";
  const hm = header.match(/Last revisit:\s*([^·]+?)\s*·\s*Verified\s*(\d+)\s*\/\s*(\d+)/);
  const out = {
    name: (all[0] || "").replace(/^#\s*Checklist\s*·\s*/, "").trim(),
    lastRevisit: hm ? hm[1].trim() : "",
    verified: hm ? Number(hm[2]) : null,
    total: hm ? Number(hm[3]) : null,
    vision: {}, fragments: [], foundation: [], qualityBars: [], changes: [],
  };
  let zone = "", frag = null;
  for (const line of all) {
    if (line.startsWith("## ")) { zone = line.slice(3).toLowerCase(); frag = null; continue; }
    const fm = line.match(/^### (F\d+) · (.+?) · depends on: (.+?) · Verify: (.+)$/);
    if (fm) {
      frag = { id: fm[1], name: fm[2].trim(), dependsOn: fm[3].trim(), verify: fm[4].trim(), forPerson: "", items: [] };
      out.fragments.push(frag);
      continue;
    }
    if (zone.startsWith("vision")) {
      const vm = line.match(/^- (Thesis|Moment of value|Core concept):\s*(.*)$/);
      if (vm) out.vision[{ Thesis: "thesis", "Moment of value": "moment", "Core concept": "core" }[vm[1]]] = vm[2].trim();
    } else if (zone.startsWith("fragments") && frag) {
      if (line.startsWith("For the person:")) frag.forPerson = line.slice(15).trim();
      const it = parseItem(line);
      if (it) frag.items.push(it);
    } else if (zone.startsWith("foundation")) {
      const it = parseItem(line);
      if (it) out.foundation.push(it);
    } else if (zone.startsWith("quality")) {
      if (line.startsWith("- ")) out.qualityBars.push(line.slice(2).trim());
    } else if (zone.startsWith("changes")) {
      const cm = line.match(/^- (\S+) · (.*)$/);
      if (cm) out.changes.push({ date: cm[1], text: cm[2].trim() });
    }
  }
  return out;
}

// DECISIONS.md: "### D-001 · Title · date · status" blocks.
function parseDecisions(md) {
  return sections(md, 3).filter((s) => /^D-\d+/.test(s.title)).map((s) => {
    const [id, title = "", date = "", ...rest] = s.title.split(" · ");
    return { id: id.trim(), title: title.trim(), date: date.trim(), status: rest.join(" · ").trim(), body: s.body };
  });
}

// GLOSSARY.md: "- Label: text" lines under "In plain words", and the Terms table.
function parseGlossary(md) {
  const secs = sections(md);
  const plainSec = secs.find((s) => /^In plain words/i.test(s.title));
  const termsSec = secs.find((s) => /^Terms/i.test(s.title));
  const plain = [];
  for (const line of lines(plainSec?.body)) {
    const m = line.match(/^- ([^:]+):\s*(.*)$/);
    if (m) plain.push({ label: m[1].trim(), text: m[2].trim(), points: [] });
    else if (/^\s+- /.test(line) && plain.length) plain[plain.length - 1].points.push(line.replace(/^\s+- /, "").trim());
  }
  const rows = lines(termsSec?.body).filter((l) => l.startsWith("|") && !/^\|\s*-/.test(l)).map((l) => l.split("|").slice(1, -1).map((c) => c.trim()));
  return { plain, terms: rows.length > 1 ? { head: rows[0], rows: rows.slice(1) } : null };
}

// "PRODUCT · name · status · reviewed date" and "STATE · updated date" style first lines.
const headerLine = (md) => (lines(md)[0] || "").split(" · ").map((s) => s.trim());

function parseProduct(md) {
  const h = headerLine(md);
  return { name: h[1] || "", status: h[2] || "", sections: sections(md).filter((s) => s.title) };
}

function parseState(md) {
  const h = headerLine(md);
  return {
    updated: (h[1] || "").replace(/^updated\s*/, ""),
    sections: sections(md).filter((s) => s.title).map((s) => ({
      title: s.title,
      items: lines(s.body).filter((l) => /^(- |\d+\. )/.test(l)).map((l) => l.replace(/^(- |\d+\. )/, "").trim()),
      body: s.body,
    })),
  };
}

// REASSESS.md: first line "REASSESS · date · alignment", then the report as written.
function parseReassess(md) {
  if (!md) return null;
  const h = headerLine(md);
  return { date: h[1] || "", alignment: (h[2] || "").toLowerCase(), body: lines(md).slice(1).join("\n").trim() };
}

/** files: { "CHECKLIST.md": text, "PRODUCT.md": text, ... } (any subset). */
function parseProject(files) {
  const f = (n) => files[n] || "";
  const checklist = parseChecklist(f("CHECKLIST.md"));
  const product = parseProduct(f("PRODUCT.md"));
  return {
    name: product.name || checklist.name || "",
    checklist,
    product,
    state: parseState(f("STATE.md")),
    decisions: parseDecisions(f("DECISIONS.md")),
    glossary: parseGlossary(f("GLOSSARY.md")),
    reassess: parseReassess(files["REASSESS.md"]),
    present: Object.keys(files).filter((n) => files[n]).sort(),
  };
}
// The view: draws a project's .offthemode/ notes as one sheet. Files are read with the File API, in this tab only,

const MARK_ORDER = ["verified", "built", "doing", "todo", "dropped"];

const MARK_SAYS = { verified: "proven, evidence cited", built: "made, not proven yet", doing: "being made", todo: "not started", dropped: "removed, reason kept" };
const ALIGN = ["on course", "drifting", "off course"];
const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
const SETUP = "/offthemode (the setup) adds it once you answer its questions";
// The files the sheet draws, its zone for each, and the command that writes it.
const FILES = [
  { zone: "A", file: "CHECKLIST.md", title: "Checklist board", shows: "every fragment and item, its mark and its proof", writer: "/revisit-checklist builds it from PRODUCT.md" },
  { zone: "B", file: "STATE.md", title: "Where things stand", shows: "what is true now, the next steps, what is waiting", writer: "/offthemode (the setup) adds it once you answer its questions; your AI keeps it current and /revisit-state saves it" },
  { zone: "C", file: "PRODUCT.md", title: "The plan", shows: "who it is for, the core concept, what it refuses", writer: SETUP },
  { zone: "D", file: "DECISIONS.md", title: "Decisions", shows: "each decision, why, and what was turned down", writer: SETUP },
  { zone: "E", file: "GLOSSARY.md", title: "Plain summary", shows: "the project in plain words, one word for each thing", writer: "/revisit-glossary writes it" },
  { zone: "F", file: "REASSESS.md", title: "Reassess", shows: "the last health check: on course, drifting or off course", writer: "/reassess saves it if you say so", optional: true },
];
const RULES = { file: "RULES.md", writer: SETUP };
const KNOWN = [...FILES.map((f) => f.file), RULES.file];
const TICK = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 4.5 16 15.8M15.6 3.8 4.2 16.2"/></svg>';

const root = document.documentElement;
const frame = document.getElementById("frame");
const picker = document.getElementById("picker");
const status = document.getElementById("status");
let IDX = { items: {}, frags: {}, decs: {} };
// The folder Chrome remembers, { handle, name }, or null (CHECKLIST F8.8).
let remembered = null;

/* ---------- text helpers ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const slug = (id) => String(id).replace(/[^A-Za-z0-9-]/g, "-");
const hex = (n) => `<svg class="hex" viewBox="0 0 24 22" role="img" aria-label="next step ${n}"><path d="M6.5 1.2h11L23 11l-5.5 9.8h-11L1 11z"/><text x="12" y="15">${n}</text></svg>`;
const delta = (n, cls, label) => `<svg class="delta ${cls || ""}" viewBox="0 0 24 22" role="img" aria-label="${esc(label || "revision " + n)}"><path d="M12 1.2 23 20.6H1z"/><text x="12" y="17.4">${esc(n)}</text></svg>`;
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

// Item, fragment and decision ids in running text become links to where they are drawn.
function refs(html) {
  let inA = false;
  return html.split(/(<[^>]+>)/).map((part) => {
    if (part.startsWith("<")) {
      if (/^<a[\s>]/i.test(part)) inA = true; else if (/^<\/a>/i.test(part)) inA = false;
      return part;
    }
    if (inA) return part;
    return part
      .replace(/\b(F\d+\.(?:\d+|Q)|F\d+|B\d+)\b/g, (m) => IDX.items[m] ? `<a class="ref" href="#it-${slug(m)}">${m}</a>` : IDX.frags[m] ? `<a class="ref" href="#frag-${slug(m)}">${m}</a>` : m)
      .replace(/\bD-\d{3}\b/g, (m) => IDX.decs[m] ? `<a class="ref ref-d" href="#dec-${m}">${m}</a>` : m);
  }).join("");
}
// Inline markdown: `code`, **bold**, links. Outside links open in a new tab, so the sheet stays open.
function inline(s) {
  const out = ' target="_blank" rel="noopener noreferrer"';
  return String(s ?? "").split(/(`[^`]+`)/).map((seg) => {
    if (/^`[^`]+`$/.test(seg)) return `<code>${esc(seg.slice(1, -1))}</code>`;
    let t = esc(seg).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, `<a href="$2"${out}>$1</a>`);
    t = t.replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:)])/g, `$1<a href="$2"${out}>$2</a>`);
    return refs(t);
  }).join("");
}
// Bold the "Waiting on me:" style lead-in of a STATE note.
function lead(s) {
  const m = /^([A-Z][A-Za-z ]{2,24}):\s/.exec(s);
  return m ? `<strong>${esc(m[1])}:</strong> ${inline(s.slice(m[0].length))}` : inline(s);
}

/* ---------- small markdown: headings, paragraphs, nested lists, tables, code blocks ---------- */
const isList = (l) => /^\s*(?:[-*]|\d+\.)\s+/.test(l);
const isTable = (l) => /^\s*\|/.test(l);
const isHead = (l) => /^#{1,6}\s/.test(l);
function md(src) {
  const lines = String(src || "").split("\n");
  let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith("```")) {
      const code = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) code.push(lines[i]);
      i++; out += `<pre><code>${esc(code.join("\n"))}</code></pre>`; continue;
    }
    if (isHead(l)) { out += `<h4>${inline(l.replace(/^#+\s*/, ""))}</h4>`; i++; continue; }
    if (isTable(l)) { const rows = []; while (i < lines.length && isTable(lines[i])) rows.push(lines[i++]); out += table(rows); continue; }
    if (isList(l)) {
      const block = [];
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && block.length))) block.push(lines[i++]);
      out += list(block); continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !isList(lines[i]) && !isTable(lines[i]) && !isHead(lines[i]) && !lines[i].startsWith("```")) para.push(lines[i++]);
    out += `<p>${inline(para.join(" "))}</p>`;
  }
  return out;
}
function list(block) {
  const items = block.map((l) => {
    const m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(l);
    return m ? { ind: m[1].length, ord: /\d/.test(m[2]), text: m[3] } : { ind: l.match(/^\s*/)[0].length, cont: true, text: l.trim() };
  });
  let pos = 0;
  const build = (ind) => {
    const tag = items[pos]?.ord ? "ol" : "ul";
    let html = `<${tag}>`;
    while (pos < items.length && items[pos].ind >= ind) {
      const it = items[pos];
      if (it.ind > ind && !it.cont) { html = html.replace(/<\/li>$/, "") + build(it.ind) + "</li>"; continue; }
      if (it.cont) { html = html.replace(/<\/li>$/, ` ${inline(it.text)}</li>`); pos++; continue; }
      html += `<li>${inline(it.text)}</li>`; pos++;
    }
    return html + `</${tag}>`;
  };
  let out = "";
  while (pos < items.length) out += build(items[pos].ind);
  return out;
}
const cells = (row) => row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
function table(rows) {
  const head = cells(rows[0]), body = rows.slice(1).filter((r) => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r));
  return `<div class="tbl-wrap"><table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>` +
    body.map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") + "</tbody></table></div>";
}

/* ---------- reading the parser's output ---------- */
const allItems = (c) => [...(c.fragments || []).flatMap((f) => f.items || []), ...(c.foundation || [])];
function counts(items) {
  const n = { verified: 0, built: 0, doing: 0, todo: 0, dropped: 0 };
  for (const it of items) if (n[it.mark] != null) n[it.mark]++;
  return n;
}
function findRefs(text) {
  const out = [], re = /\b(F\d+\.(?:\d+|Q)|F\d+|B\d+|D-\d{3})\b/g;
  for (const m of String(text || "").matchAll(re)) if (!out.includes(m[1])) out.push(m[1]);
  return out;
}
const stateSection = (d, re) => (d.state?.sections || []).find((s) => re.test(s.title));
function sectionItems(s) {
  if (!s) return [];
  if (s.items?.length) return s.items;
  return String(s.body || "").split("\n").map((l) => l.replace(/^\s*(?:[-*]|\d+\.)\s+/, "").trim()).filter(Boolean);
}
function splitTitle(t) {
  const m = /^(.*?)\s*\((.+)\)\s*$/.exec(t || "");
  return m ? { t: m[1], sub: m[2] } : { t, sub: "" };
}
function stampDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
  return m ? `${m[3]} ${MONTHS[+m[2] - 1] || m[2]} ${m[1]}` : (s || "not yet");
}
// "missing", "empty" or "" for a file name, from what was read.
const fileGap = (ctx, name) => !(name in ctx.read) ? "missing" : ctx.d.present.includes(name) ? "" : "empty";

function gapLine(ctx, fs) {
  const names = fs.map((f) => `<b>${f.file}</b>`), many = fs.length > 1;
  const list = many ? `${names.slice(0, -1).join(", ")} and ${names.at(-1)}` : names[0];
  const what = fileGap(ctx, fs[0].file) === "empty" ? "empty" : "not in this folder";
  return `${list} ${many ? "are" : "is"} ${what}. ${cap(many ? fs[0].writer.replace(" it", " them") : fs[0].writer)}.`;
}

/* ---------- title block ---------- */
function reviewStamp(ctx) {

  const label = `Review stamp: ${ctx.verified} of ${ctx.total} verified. ${r ? `Reassess ${r.date}: ${al || "no result"}.` : "Not reassessed yet."}`;
  return `<div class="stamp landing" role="group" aria-label="${esc(label)}">` +

function keyCell(ctx) {

/* The change mark: "dot" draws a small red dot; any other value is drawn as that symbol. The author chose the up

const CHANGED = "↑";
const plainDate = (v) => { const m = String(v || "").match(/(\d{4})-(\d{2})-(\d{2})/); return m ? `${+m[3]} ${MONTHS[+m[2] - 1].charAt(0)}${MONTHS[+m[2] - 1].slice(1).toLowerCase()} ${m[1]}` : String(v || ""); };
const chg = (rev, ctx) => {

  return `<span class="chg ${CHANGED === "dot" ? "chg-dot" : "chg-sym"}" title="${esc(say)}" role="img" aria-label="${esc(say)}">${CHANGED === "dot" ? "" : esc(CHANGED)}</span>`;
};
/* ---------- A: the board ---------- */
function itemHTML(it, ctx) {
  let text = String(it.text || ""), hold = "";
  const k = text.indexOf(" · blocked on: ");
  if (k >= 0) { hold = text.slice(k + 15); text = text.slice(0, k); }
  const notes = ctx.nextByRef[it.id] || [], rev = ctx.cloudByRef[it.id];
  const tags = notes.map(hex).join("");
  const has = it.doneWhen || it.evidence || it.guide || it.dropped;
  const cls = `it m-${esc(it.mark)}${notes.length ? " next" : ""}`;
  const head = `<i class="mk mk-${esc(it.mark)}" aria-hidden="true"></i><span class="it-id">${esc(it.id)}</span>` +
    `<span class="it-text"><span class="sr">${MARK_WORD[it.mark]}: </span>${inline(text)}${rev ? chg(rev, ctx) : ""}${hold ? `<span class="hold"><b>Hold</b>blocked on ${inline(hold)}</span>` : ""}</span>` +
    `<span class="it-tags">${tags}${has ? '<span class="plus" aria-hidden="true">+</span>' : ""}</span>`;
  if (!has) return `<li class="${cls}" id="it-${slug(it.id)}"><div class="row">${head}</div></li>`;
  let dl = it.dropped ? `<dt class="lab">Dropped because</dt><dd>${inline(it.dropped)}</dd>` : "";
  dl += `<dt class="lab">Done when</dt><dd>${it.doneWhen ? inline(it.doneWhen) : '<span class="none">not written</span>'}</dd>`;
  dl += `<dt class="lab">Evidence</dt><dd>${it.evidence ? inline(it.evidence) : '<span class="none">none yet</span>'}</dd>`;
  if (it.guide) dl += `<dt class="lab">Guide</dt><dd class="g">${esc(it.guide)}</dd>`;
  return `<li class="${cls}" id="it-${slug(it.id)}"><details><summary>${head}</summary><dl class="it-detail">${dl}</dl></details></li>`;

function bayHTML(f, ctx, isFoundation) {
  const items = f.items || [], live = items.filter((i) => i.mark !== "dropped"), n = counts(items);
  const id = isFoundation ? "B" : f.id, rev = ctx.cloudByRef[id];
  const count = `${n.verified} of ${live.length} verified` + ["built", "doing", "dropped"].map((m) => n[m] ? ` · ${n[m]}\u00a0${m}` : "").join("");
  let meta = f.forPerson ? `<div><dt class="lab">What they get</dt><dd class="for">${inline(f.forPerson)}</dd></div>` : "";

  if (f.verify) meta += `<div><dt class="lab">Proven</dt><dd>${f.verify === "early" ? "item by item, as each is built" : "at completion, when the whole fragment runs end to end"}</dd></div>`;
  if (isFoundation) meta += '<div><dt class="lab">Under</dt><dd>every fragment</dd></div>';

    `<h3 id="fh-${slug(id)}"><span class="sr">${esc(id)} </span>${esc(isFoundation ? "Foundation" : f.name)}${rev ? chg(rev, ctx) : ""}</h3>${meta ? `<dl>${meta}</dl>` : ""}</div>` +
    `<ol class="items">${items.map((it) => itemHTML(it, ctx)).join("")}</ol></section>`;

const zoneHead = (z, title, meta) => `<span class="zl" aria-hidden="true">${z}</span><header class="vt"><span class="bub" aria-hidden="true">${z}</span>` +
  `<div class="vt-t"><h2 id="h-${z}">${title}</h2><p class="vt-meta">${meta}</p></div></header>`;
const gapRow = (ctx, f) => `<div class="lr"><div class="l"><h3>Not drawn</h3></div><div class="r"><p class="pointer">${gapLine(ctx, [f])}</p></div></div>`;
function boardHTML(ctx) {

  return `<section class="zone" id="zone-A" aria-labelledby="h-A">${zoneHead("A", "Checklist board", `CHECKLIST.md · revisited ${esc(c.lastRevisit || "—")} · open any item for its proof`)}` +

/* ---------- B to F: the zones below ---------- */
function stateHTML(d, ctx) {
  const st = d.state, f = FILES[1];
  const open = `<section class="zone" id="zone-B" aria-labelledby="h-B">${zoneHead("B", "Where things stand", `STATE.md · ${fileGap(ctx, f.file) ? "not in this folder" : `updated ${esc(st.updated || "—")}`}`)}`;
  if (fileGap(ctx, f.file)) return open + gapRow(ctx, f) + "</section>";
  const now = stateSection(d, /^Now/);

function planHTML(d, ctx) {

  if (gap) return open + gapRow(ctx, f) + "</section>";
  return open + (p.sections || []).map((s, i) => {
    const t = splitTitle(s.title);
    return `<div class="lr"><div class="l"><span class="num">${String(i + 1).padStart(2, "0")}</span><h3>${esc(t.t)}</h3>${t.sub ? `<span class="sub">${esc(t.sub)}</span>` : ""}</div>` +

function decBody(body) {

  if (gap) return open + gapRow(ctx, f) + "</section>";
  if (!decs.length) return open + '<div class="lr"><div class="l"><h3>None yet</h3></div><div class="r"><p class="pointer">No decisions recorded yet.</p></div></div></section>';

/* ---------- context: every count comes from the parser's items ---------- */
function clouds(changes) {
  // Only the latest revision is clouded, and never the first issue.
  const latest = changes.reduce((m, ch) => (ch.date > m ? ch.date : m), ""), byRef = {}, revs = [];
  changes.forEach((ch, i) => {
    if (ch.date !== latest || /^created\b/i.test(ch.text)) return;
    revs.push(i + 1);
    for (const r of findRefs(ch.text)) if (!r.startsWith("D-")) byRef[r] = i + 1;
  });
  return { cloudByRef: byRef, cloudRevs: revs, cloudDate: revs.length ? latest : "" };
}
function buildCtx(d, read) {
  const c = d.checklist, items = allItems(c), n = counts(items);
  IDX = { items: {}, frags: {}, decs: {} };
  for (const it of items) IDX.items[it.id] = it;
  for (const f of c.fragments) IDX.frags[f.id] = f;
  if (c.foundation.length) IDX.frags.B = true;
  for (const x of d.decisions) IDX.decs[x.id] = x;
  const next = sectionItems(stateSection(d, /^Next/)), nextByRef = {};
  next.forEach((t, i) => { for (const r of findRefs(t)) (nextByRef[r] ||= []).push(i + 1); });
  const decBack = {};
  for (const it of items) for (const r of findRefs(`${it.text} ${it.doneWhen}`)) if (r.startsWith("D-") && !(decBack[r] ||= []).includes(it.id)) decBack[r].push(it.id);
  return {
    d, c, items, n, verified: n.verified, total: items.length - n.dropped, next, nextByRef, decBack, ...clouds(c.changes),
    reassess: d.reassess, read: read.files, folder: read.folder, count: Object.keys(read.files).length, hasChecklist: d.present.includes("CHECKLIST.md"),
    snapshot: Boolean(read.snapshot), skipped: read.skipped ?? [],
  };
}

/* ---------- surfaces ---------- */
// Draws the project and returns the name to remember it by.

    stateHTML(d, ctx) + planHTML(d, ctx) + decisionsHTML(d, ctx) + plainHTML(d, ctx) + reassessHTML(ctx) + "</div>";
  document.title = `${d.name || "Your project"} · the view`;

    ? `A snapshot of ${files} from ${read.folder}, made by /view-project.${skippedNote(ctx.skipped)} Run /view-project again after the notes change. Nothing was sent.`

/* ---------- reading a folder: three ways in, one shape out ---------- */
// Each lister returns the folder's entries as { name, isDir, text(), list() }, so the reading rule is written once.
const listHandle = (dir) => async () => {
  const out = [];
  for await (const h of dir.values()) out.push({ name: h.name, isDir: h.kind === "directory", text: async () => (await h.getFile()).text(), list: h.kind === "directory" ? listHandle(h) : null });
  return out;
};
const listEntry = (dir) => async () => {
  const reader = dir.createReader(), out = [];
  for (;;) {
    const batch = await new Promise((ok, no) => reader.readEntries(ok, no));
    if (!batch.length) return out;
    for (const e of batch) out.push({ name: e.name, isDir: e.isDirectory, text: () => new Promise((ok, no) => e.file(ok, no)).then((f) => f.text()), list: e.isDirectory ? listEntry(e) : null });
  }
};
const fileItem = (f) => ({ name: f.name, isDir: false, text: () => f.text(), list: null });
// <input webkitdirectory> hands over every file below the folder at once, each with its path.
const listInput = (files, inner) => async () => {
  const out = [];
  let hasInner = false;
  for (const f of files) {
    const p = (f.webkitRelativePath || f.name).split("/");
    if (p.length === 1) { if (!inner) out.push(fileItem(f)); continue; }
    if (inner) { if (p.length === 3 && p[1] === ".offthemode") out.push(fileItem(f)); continue; }
    if (p.length === 2) out.push(fileItem(f)); else if (p[1] === ".offthemode") hasInner = true;
  }
  if (hasInner) out.push({ name: ".offthemode", isDir: true, list: listInput(files, true) });
  return out;
};
// Every .md file at the top of the folder, keyed by name. Picked the project instead? Its .offthemode/ is read.
async function readFolder(name, list) {
  const entries = await list(), files = {};
  for (const e of entries) if (!e.isDir && /\.md$/i.test(e.name)) files[e.name] = await e.text();
  const inner = entries.find((e) => e.isDir && e.name === ".offthemode");
  if (inner && !KNOWN.some((k) => k in files)) return readFolder(`${name}/.offthemode`, inner.list);
  return { files, folder: name };
}
// Returns the drawn project's name, or null when the folder could not be drawn (the entry says why).
async function load(name, list) {
  let read;
  try { read = await readFolder(name, list); } catch (e) {
    renderEntry(`That folder could not be read (${e.message || e.name}). Try again, or drop the folder onto this page.`);
    return null;
  }
  if (!KNOWN.some((k) => k in read.files)) {
    renderEntry(`The folder "${read.folder}" has none of the Off the Mode files. Open the .offthemode folder inside your project, or the project folder that holds it.`);
    return null;
  }
  return renderProject(read);
}

/* ---------- a snapshot from /view-project ---------- */
// /view-project copies this page and adds each note after </html> as <template data-offthemode-file="NAME.md">, its
// bytes in base64; the HTML parser moves them into <body>. Templates are not scripts, so the CSP stays as built.
function readEmbedded(templates) {
  const files = {}, unread = [];
  for (const t of templates) {
    const name = t.dataset.offthemodeFile || "";
    if (!/^[^/\\]+\.md$/i.test(name)) { unread.push(name ? `"${name}"` : "a file with no name"); continue; }
    try {
      const bytes = Uint8Array.from(atob(t.content.textContent.replace(/\s+/g, "")), (c) => c.charCodeAt(0));
      files[name] = new TextDecoder().decode(bytes);
    } catch (e) {
      if (e.name !== "InvalidCharacterError") throw e;
      unread.push(`"${name}"`);
    }
  }
  return { files, unread };
}
// One note that can't be read (a quote mark in its name breaks its tag) only leaves that note out.
function loadSnapshot(templates) {
  const { files, unread } = readEmbedded(templates);
  if (!KNOWN.some((k) => k in files)) {
    const why = unread.length ? `${unread.join(", ")} could not be read` : "it holds none of the Off the Mode files";
    renderEntry(`This page came from /view-project, but ${why}. Run /view-project again in the project folder that holds .offthemode.`);
    return;
  }
  renderProject({ files, folder: ".offthemode", snapshot: true, skipped: unread });
}

/* ---------- Chrome remembers the folder (IndexedDB, in this browser only) ---------- */
const MEMORY = { db: "offthemode-view", store: "folders", key: "last" };
function memory(mode, act) {
  return new Promise((ok, no) => {
    const open = indexedDB.open(MEMORY.db, 1);
    open.onupgradeneeded = () => open.result.createObjectStore(MEMORY.store);
    open.onerror = () => no(open.error);
    open.onsuccess = () => {
      const db = open.result;
      try {
        const tx = db.transaction(MEMORY.store, mode), req = act(tx.objectStore(MEMORY.store));
        tx.oncomplete = () => { db.close(); ok(req.result); };
        tx.onabort = () => { db.close(); no(tx.error); };
      } catch (e) { db.close(); no(e); }
    };
  });
}
// Only Chrome and Edge pick folders by handle; elsewhere there is nothing to reopen.
async function recall() {
  if (typeof window.showDirectoryPicker !== "function" || !window.indexedDB) return null;
  const rec = await memory("readonly", (s) => s.get(MEMORY.key));
  const ok = rec?.handle?.kind === "directory" && typeof rec.handle.requestPermission === "function" && typeof rec.name === "string";
  return ok ? { handle: rec.handle, name: rec.name } : null;
}
// Remembering is a convenience: if this browser won't store it, the open button still works next time.
function keepFolder(handle, name) {
  remembered = { handle, name };
  memory("readwrite", (s) => s.put(remembered, MEMORY.key)).catch(() => {});
}
function forgetFolder() {
  remembered = null;
  memory("readwrite", (s) => s.delete(MEMORY.key)).catch(() => {});
}
async function openHandle(dir) {
  const name = await load(dir.name, listHandle(dir));
  if (name) keepFolder(dir, name);
}
async function reopen() {
  const { handle, name } = remembered;
  // Chrome asks again after a reload; the click on Reopen is what lets it ask.
  const state = await handle.requestPermission({ mode: "read" }).catch((e) => e.name);
  if (state !== "granted") { renderEntry(`Chrome did not allow reading ${name} this time. Reopen asks again, or open another folder.`); return; }
  // A folder moved or deleted since can't come back through this handle, so it is forgotten.
  const gone = await handle.values().next().then(() => false, (e) => e.name === "NotFoundError");
  if (gone) { forgetFolder(); renderEntry(`The folder for ${name} was moved or deleted. Open it again from where it is now.`); return; }
  openHandle(handle);
}

/* ---------- behaviour ---------- */
function currentTheme() {
  return root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
async function openFolder() {
  // Chrome and Edge ask "let this site view files?" and read only what the page opens; others use the file input.
  if (typeof window.showDirectoryPicker !== "function") { picker.click(); return; }
  let dir;
  try { dir = await window.showDirectoryPicker({ id: "offthemode", mode: "read" }); } catch (e) {
    if (e.name !== "AbortError") renderEntry(`The folder could not be opened (${e.message || e.name}). Try again, or drop it onto this page.`);
    return;
  }
  openHandle(dir);
}
document.addEventListener("click", (e) => {
  const el = e.target.closest?.("[data-open], [data-reopen], [data-theme-set], a[href^='#']");
  if (!el) return;
  if (el.hasAttribute("data-open")) { openFolder(); return; }
  if (el.hasAttribute("data-reopen")) { if (remembered) reopen(); return; }
  if (el.hasAttribute("data-theme-set")) {
    root.dataset.theme = el.dataset.themeSet;
    for (const b of document.querySelectorAll("[data-theme-set]")) b.setAttribute("aria-pressed", String(b.dataset.themeSet === root.dataset.theme));
    return;
  }
  // Following a link to a board item opens its proof.
  const target = document.getElementById(el.getAttribute("href").slice(1));
  const det = target?.querySelector(":scope > details");
  if (det && target !== el.closest("li")) det.open = true;
});
picker.addEventListener("change", () => {
  const files = [...picker.files];
  picker.value = "";
  if (!files.length) return;
  load(files[0].webkitRelativePath.split("/")[0] || "the folder", listInput(files, false));
});
let dragDepth = 0;
const dropping = (on) => document.body.classList.toggle("dropping", on);
document.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; dropping(true); });
document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; dropping(false); } });
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => {
  e.preventDefault(); dragDepth = 0; dropping(false);
  // The entries must be taken while the drop event runs; the browser empties the list afterwards.
  const entries = [...(e.dataTransfer?.items || [])].map((i) => i.webkitGetAsEntry?.()).filter(Boolean);
  const dir = entries.length === 1 && entries[0].isDirectory ? entries[0] : null;
  if (dir) { load(dir.name, listEntry(dir)); return; }
  const loose = entries.filter((x) => x.isFile).map((x) => ({ name: x.name, isDir: false, list: null, text: () => new Promise((ok, no) => x.file(ok, no)).then((f) => f.text()) }));
  if (loose.length) load("the dropped files", async () => loose);
});
// Load every font face now, so opening a folder later asks the network for nothing, not even a missing glyph.
function loadFaces() {
  // A face that fails falls back to the next font in its stack; there is nothing for the reader to do about it.
  document.fonts.forEach((f) => { if (f.status === "unloaded") f.load().catch(() => {}); });
}
const fontsheet = document.querySelector('link[rel="stylesheet"]');
if (fontsheet?.sheet) loadFaces(); else fontsheet?.addEventListener("load", loadFaces);
// A snapshot from /view-project draws at once; otherwise the entry, with Reopen if Chrome remembers a folder.
// A browser that stores nothing (blocked site data, some private windows) gets the normal open button.
const embedded = document.querySelectorAll("template[data-offthemode-file]");
if (embedded.length) loadSnapshot(embedded);
else recall().then((r) => { remembered = r; }, () => {}).finally(() => renderEntry(""));
